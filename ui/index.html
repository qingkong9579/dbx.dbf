<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>DBF Studio</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-dbx-theme="light">
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><path d="M8 21v-7h8v7"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5"/><path d="M5 8h14a1 1 0 0 1 1 1v7h-4v5H8v-5H4V9a1 1 0 0 1 1-1Z"/><path d="M8 13h8v8H8z"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M3 15h18M9 4v16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></symbol>
  <symbol id="i-first" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7z"/></symbol>
  <symbol id="i-last" viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></symbol>
  <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M9.5 4v16M15 4v16"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.6"/></symbol>
  <symbol id="i-structure" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/><circle cx="19" cy="12" r="1.4"/><circle cx="20" cy="18" r="1.4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="m14.5 5.5 4 4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 6"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19Z"/><path d="M12 9v5M12 17v.6"/></symbol>
  <symbol id="i-memo" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.6 2.6 0 1 1 3.7 2.4c-.8.4-1.2 1-1.2 1.9M12 17v.6"/></symbol>
</svg>

<div id="app" class="app is-empty" data-density="normal">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="2" y="4" width="28" height="24" rx="4"/><path d="M2 11h28M2 18h28M11 4v24"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" data-i18n="app.name">DBF Studio</span>
        <span class="brand-tag" data-i18n="app.tagline">证券登记结算 DBF 数据工作台</span>
      </span>
    </div>

    <div class="file-chip" id="fileChip" hidden>
      <span class="file-name" id="fileName">—</span>
      <span class="badge" id="fileVersion">dBase III</span>
      <button class="chip-btn" id="encodingBtn" type="button" title="编码">
        <span id="encodingLabel">GBK</span>
      </button>
      <button class="chip-btn ghost" id="fileCloseBtn" type="button" data-i18n-title="btn.close" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>

    <div class="topbar-spacer"></div>

    <div class="topbar-actions">
      <button class="btn primary" id="openBtn" type="button">
        <svg class="ico"><use href="#i-open"/></svg><span data-i18n="btn.openFile">打开 DBF</span>
      </button>
      <button class="btn" id="saveBtn" type="button" disabled>
        <svg class="ico"><use href="#i-save"/></svg><span data-i18n="btn.save">保存</span>
      </button>
      <div class="split">
        <button class="btn" id="exportBtn" type="button" disabled>
          <svg class="ico"><use href="#i-export"/></svg><span data-i18n="btn.export">导出</span>
        </button>
        <button class="btn caret" id="exportMenuBtn" type="button" disabled aria-haspopup="menu" aria-expanded="false">
          <svg class="ico chev"><use href="#i-next"/></svg>
        </button>
      </div>
      <button class="btn icon-only" id="printBtn" type="button" disabled data-i18n-title="btn.print">
        <svg class="ico"><use href="#i-print"/></svg>
      </button>
      <div class="split">
        <button class="btn icon-only" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="btn.settings">
          <svg class="ico"><use href="#i-more"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="nav-cluster" role="group" aria-label="records">
      <button class="btn icon-only" id="navFirst" type="button" data-i18n-title="nav.first"><svg class="ico"><use href="#i-first"/></svg></button>
      <button class="btn icon-only" id="navPrev" type="button" data-i18n-title="nav.prev"><svg class="ico"><use href="#i-prev"/></svg></button>
      <div class="record-input">
        <input id="recordNo" inputmode="numeric" value="1" aria-label="record" />
        <span class="record-total" id="recordTotal">/ 0</span>
      </div>
      <button class="btn icon-only" id="navNext" type="button" data-i18n-title="nav.next"><svg class="ico"><use href="#i-next"/></svg></button>
      <button class="btn icon-only" id="navLast" type="button" data-i18n-title="nav.last"><svg class="ico"><use href="#i-last"/></svg></button>
    </div>

    <div class="sep"></div>

    <div class="edit-cluster" role="group" aria-label="edit">
      <button class="btn icon-only" id="addRowBtn" type="button" data-i18n-title="nav.add" disabled><svg class="ico"><use href="#i-plus"/></svg></button>
      <button class="btn icon-only danger" id="delRowBtn" type="button" data-i18n-title="nav.delete" disabled><svg class="ico"><use href="#i-trash"/></svg></button>
      <button class="btn icon-only" id="restoreRowBtn" type="button" data-i18n-title="nav.restore" disabled><svg class="ico"><use href="#i-restore"/></svg></button>
      <button class="btn icon-only" id="commitBtn" type="button" data-i18n-title="nav.commit" disabled><svg class="ico"><use href="#i-check"/></svg></button>
    </div>

    <div class="sep"></div>

    <div class="search-cluster">
      <span class="search-box">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" data-i18n-ph="search.placeholder" autocomplete="off" />
        <select id="searchField" class="mini-select" aria-label="field"></select>
      </span>
      <button class="btn icon-only" id="searchNextBtn" type="button" data-i18n-title="search.next"><svg class="ico"><use href="#i-next"/></svg></button>
      <span class="search-hits" id="searchHits"></span>
    </div>

    <div class="sep"></div>

    <span class="search-box filter-box">
      <svg class="ico"><use href="#i-filter"/></svg>
      <input id="filterInput" type="search" data-i18n-ph="filter.placeholder" autocomplete="off" />
      <button class="mini-x" id="filterClear" type="button" hidden aria-label="clear"><svg class="ico"><use href="#i-close"/></svg></button>
    </span>

    <div class="topbar-spacer"></div>

    <label class="toggle" id="showDeletedWrap"><input type="checkbox" id="showDeleted" /><span data-i18n="view.showDeleted">显示已删除</span></label>
    <button class="btn icon-only" id="columnsBtn" type="button" data-i18n-title="col.settings"><svg class="ico"><use href="#i-columns"/></svg></button>
    <button class="btn icon-only" id="panelToggle" type="button" data-i18n-title="panel.record"><svg class="ico"><use href="#i-info"/></svg></button>
  </div>

  <main class="workspace">
    <aside class="sidebar" id="sidebar">
      <nav class="side-tabs" role="tablist">
        <button class="side-tab is-active" data-side-tab="structure" role="tab"><svg class="ico"><use href="#i-structure"/></svg><span data-i18n="panel.structure">字段结构</span></button>
        <button class="side-tab" data-side-tab="info" role="tab"><svg class="ico"><use href="#i-info"/></svg><span data-i18n="panel.info">文件信息</span></button>
      </nav>
      <div class="side-body">
        <section class="side-pane is-active" data-side-pane="structure">
          <div class="pane-actions">
            <button class="btn tiny" id="addFieldBtn" type="button" disabled><svg class="ico"><use href="#i-plus"/></svg><span data-i18n="field.add">添加字段</span></button>
          </div>
          <ul class="field-list" id="fieldList"></ul>
        </section>
        <section class="side-pane" data-side-pane="info">
          <dl class="info-list" id="infoList"></dl>
          <div class="info-note" id="infoNote" hidden></div>
        </section>
      </div>
    </aside>

    <section class="grid-area">
      <div class="grid-scroll" id="gridScroll">
        <table class="grid" id="grid">
          <thead id="gridHead"></thead>
          <tbody id="gridBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState">
          <div class="drop-card">
            <svg class="ico big"><use href="#i-table"/></svg>
            <h2 data-i18n="msg.noFile.title">尚未打开数据表</h2>
            <p data-i18n="msg.noFile.body">点击“打开”选择 DBF 文件，或把 DBF 文件（可整目录）拖入此窗口。</p>
            <div class="empty-actions">
              <button class="btn primary" id="emptyOpenBtn" type="button"><svg class="ico"><use href="#i-open"/></svg><span data-i18n="btn.openFile">打开 DBF</span></button>
              <button class="btn" id="emptyNewBtn" type="button"><svg class="ico"><use href="#i-plus"/></svg><span data-i18n="btn.newTable">新建表</span></button>
              <button class="btn" id="emptyCsvBtn" type="button"><svg class="ico"><use href="#i-import"/></svg><span data-i18n="btn.importCsv">导入 CSV</span></button>
            </div>
            <div class="sample-row" id="sampleRow"></div>
          </div>
        </div>
      </div>
      <div class="pager" id="pager" hidden>
        <span class="pager-info" id="pagerInfo"></span>
        <div class="topbar-spacer"></div>
        <select id="pageSize" class="mini-select">
          <option value="100">100</option>
          <option value="500" selected>500</option>
          <option value="2000">2000</option>
          <option value="0">全部</option>
        </select>
        <button class="btn icon-only" id="pagePrev" type="button"><svg class="ico"><use href="#i-prev"/></svg></button>
        <button class="btn icon-only" id="pageNext" type="button"><svg class="ico"><use href="#i-next"/></svg></button>
      </div>
    </section>

    <aside class="detail" id="detail">
      <div class="detail-head">
        <nav class="side-tabs compact" role="tablist">
          <button class="side-tab is-active" data-detail-tab="record" role="tab" data-i18n="panel.record">记录详情</button>
          <button class="side-tab" data-detail-tab="memo" role="tab" data-i18n="panel.memo">备注</button>
          <button class="side-tab" data-detail-tab="validation" role="tab" data-i18n="panel.validation">校验</button>
        </nav>
        <button class="btn icon-only ghost" id="detailClose" type="button" aria-label="close"><svg class="ico"><use href="#i-close"/></svg></button>
      </div>
      <div class="detail-body">
        <section class="detail-pane is-active" data-detail-pane="record">
          <div class="detail-empty" id="detailEmpty">—</div>
          <dl class="record-form" id="recordForm"></dl>
        </section>
        <section class="detail-pane" data-detail-pane="memo">
          <div class="memo-box" id="memoBox"></div>
        </section>
        <section class="detail-pane" data-detail-pane="validation">
          <ul class="issue-list" id="issueList"></ul>
        </section>
      </div>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="status-item" id="stRows">0 行</span>
    <span class="status-item" id="stCols">0 列</span>
    <span class="status-item" id="stSel"></span>
    <span class="status-item" id="stIssues"></span>
    <div class="topbar-spacer"></div>
    <span class="status-item muted" id="stDirty"></span>
    <span class="status-item muted" id="stEncoding"></span>
    <span class="status-item muted" id="stTrace"></span>
  </footer>

  <div class="dropzone" id="dropzone" hidden>
    <div class="dropzone-inner"><svg class="ico big"><use href="#i-open"/></svg><span data-i18n="msg.dropHint">松开以打开 DBF 文件</span></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="menu-root" id="menuRoot" hidden></div>
</div>

<script src="js/gbk-table.js"></script>
<script src="js/dbf-core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/dict.js"></script>
<script src="js/samples.js"></script>
<script src="js/app.js"></script>
<script src="js/views.js"></script>
</body>
</html>
